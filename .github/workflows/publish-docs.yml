# Publish the Quarto documentation site to GitHub Pages.
#
# Renders docs/ (per _quarto.yml at the repo root) and deploys to Pages
# on every push to main that touches the documentation or site config.
#
# One-time repository setup:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_quarto.yml"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
